<!DOCTYPE html>
<html lang="fr" class="h-full bg-[#f8f6f0]">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Membres — Église Vases d'Honneur</title>
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    /* Styles pour les lignes générées par membres.js */
    #membersTableBody td { padding: 12px 16px; font-size: 14px; color: #334155; }
    #membersTableBody tr { border-bottom: 1px solid #e7e5e4; transition: background 0.2s; }
    #membersTableBody tr:hover { background: #faf9f7; }
    #membersTableBody a { color: #0d9488; font-weight: 600; text-decoration: none; }
    #membersTableBody a:hover { text-decoration: underline; }
  </style>
</head>
<body class="h-full text-slate-800 antialiased font-sans">

  <div class="min-h-full flex">

    <!-- CONTENU (100% INTACT, RIEN N'A ÉTÉ MODIFIÉ ICI) -->
    <div class="flex-1 flex flex-col min-w-0">

      <header class="px-4 md:px-8 py-6 max-w-6xl mx-auto w-full">
        <h1 class="text-xl font-bold text-slate-900">👥 Gestion des membres</h1>
        <p class="text-sm text-slate-600">Liste des personnes enregistrées dans la communauté</p>
      </header>

      <main class="px-4 md:px-8 pb-10 space-y-6 max-w-6xl mx-auto w-full">

        <!-- RECHERCHE ET FILTRES -->
        <div class="bg-[#f0ebe1] p-6 rounded-2xl border border-stone-200/60 shadow-sm space-y-4">

          <div>
            <span class="text-xs font-semibold uppercase text-slate-500 tracking-wider">Recherche</span>
            <h3 class="text-lg font-bold text-slate-800">Trouver un membre</h3>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">

            <div class="lg:col-span-2">
              <label class="text-xs font-semibold text-slate-700 mb-1 block">🔎 Rechercher</label>
              <input type="text" id="recherche" placeholder="Nom, téléphone ou courriel..."
                class="w-full px-4 py-2 rounded-lg border border-stone-300 bg-white text-sm focus:border-teal-500 focus:ring-2 focus:ring-teal-200 outline-none transition">
            </div>

            <div>
              <label class="text-xs font-semibold text-slate-700 mb-1 block">📍 Secteur</label>
              <select id="filtreSecteur"
                class="w-full px-4 py-2 rounded-lg border border-stone-300 bg-white text-sm focus:border-teal-500 focus:ring-2 focus:ring-teal-200 outline-none transition">
                <option value="">Tous les secteurs</option>
                <option value="Chicoutimi">Chicoutimi</option>
                <option value="Jonquière">Jonquière</option>
                <option value="Arvida">Arvida</option>
                <option value="Alma">Alma</option>
                <option value="Autre">Autre</option>
              </select>
            </div>

            <div>
              <label class="text-xs font-semibold text-slate-700 mb-1 block">🏢 Département</label>
              <select id="filtreDepartement"
                class="w-full px-4 py-2 rounded-lg border border-stone-300 bg-white text-sm focus:border-teal-500 focus:ring-2 focus:ring-teal-200 outline-none transition">
                <option value="">Tous les départements</option>
                <option value="La COM">La COM</option>
                <option value="La chorale">La chorale</option>
                <option value="L'accueil">L'accueil</option>
                <option value="L'administration">L'administration</option>
                <option value="Les enfants">Les enfants</option>
                <option value="L'intercession">L'intercession</option>
              </select>
            </div>

            <div>
              <label class="text-xs font-semibold text-slate-700 mb-1 block">👤 Fonction</label>
              <select id="filtreFonction"
                class="w-full px-4 py-2 rounded-lg border border-stone-300 bg-white text-sm focus:border-teal-500 focus:ring-2 focus:ring-teal-200 outline-none transition">
                <option value="">Toutes les fonctions</option>
                <option value="Membre">Membre</option>
                <option value="AP">AP</option>
                <option value="Responsable de louange">Responsable de louange</option>
                <option value="Responsable de la COM">Responsable de la COM</option>
                <option value="Responsable de l'accueil">Responsable de l'accueil</option>
                <option value="Les Boss">Les Boss</option>
              </select>
            </div>

            <div class="flex items-end">
              <button type="button" id="resetFiltres"
                class="w-full bg-stone-200 hover:bg-stone-300 text-slate-700 text-sm font-semibold px-4 py-2 rounded-lg transition">
                ↺ Réinitialiser les filtres
              </button>
            </div>

          </div>

          <div id="nombreMembres" class="text-sm font-semibold text-slate-700 bg-white rounded-lg px-4 py-2 border border-stone-200 inline-block">
            Chargement des membres...
          </div>

        </div>

        <!-- TABLE DES MEMBRES -->
        <div class="bg-[#f0ebe1] p-6 rounded-2xl border border-stone-200/60 shadow-sm">

          <div class="mb-4">
            <span class="text-xs font-semibold uppercase text-slate-500 tracking-wider">Liste</span>
            <h3 class="text-lg font-bold text-slate-800">Tous les membres</h3>
          </div>

          <div class="overflow-x-auto bg-white rounded-xl border border-stone-200">

            <table class="w-full text-sm text-left">

              <thead class="bg-[#e8e2d5] text-slate-700 uppercase text-xs">
                <tr>
                  <th class="px-4 py-3">ID</th>
                  <th class="px-4 py-3">Nom complet</th>
                  <th class="px-4 py-3">Téléphone</th>
                  <th class="px-4 py-3">Courriel</th>
                  <th class="px-4 py-3">Secteur</th>
                  <th class="px-4 py-3">Département</th>
                  <th class="px-4 py-3">Fonction</th>
                </tr>
              </thead>

              <tbody id="membersTableBody">
              </tbody>

            </table>

          </div>

        </div>

        <footer class="text-center text-xs text-slate-500 pt-4">
          <p>Église Vases d'Honneur de Jonquière</p>
          <p>Que Dieu vous bénisse abondamment 🤍</p>
        </footer>

      </main>

    </div>
  </div>

  <!-- SCRIPTS -->
  <script src="membres.js"></script>
  <script src="/navigation.js"></script>
</body>
</html>
